[package]
name = "xtask"
description = "Developer tasks for the VSD workspace (conformance-vector generation)."
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
vsd-core = { workspace = true, features = ["std"] }
