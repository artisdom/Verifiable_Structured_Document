[workspace]
resolver = "2"
members = [
    "crates/vsd-core",
    "crates/vsd-container",
    "crates/vsd-sign",
    "crates/vsd-layout",
    "crates/vsd-render",
    "crates/vsd-pdf",
    "crates/vsd-web",
    "crates/vsd-view",
    "crates/vsd-tlog",
    "crates/vsd-cli",
    "xtask",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.25.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["VSD Contributors"]
repository = "https://github.com/vsd-format/vsd"
keywords = ["document", "format", "verifiable", "pdf", "cbor"]
categories = ["encoding", "parser-implementations"]

[workspace.dependencies]
vsd-core = { path = "crates/vsd-core", version = "0.25.0", default-features = false }
vsd-container = { path = "crates/vsd-container", version = "0.25.0", default-features = false }
vsd-sign = { path = "crates/vsd-sign", version = "0.25.0", default-features = false }
vsd-layout = { path = "crates/vsd-layout", version = "0.25.0" }
vsd-render = { path = "crates/vsd-render", version = "0.25.0" }
vsd-pdf = { path = "crates/vsd-pdf", version = "0.25.0" }
vsd-tlog = { path = "crates/vsd-tlog", version = "0.25.0" }

blake3 = { version = "1.5", default-features = false }
thiserror = { version = "2", default-features = false }
zstd = "0.13"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
regex = "1"
hex = { version = "0.4", default-features = false, features = ["alloc"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
