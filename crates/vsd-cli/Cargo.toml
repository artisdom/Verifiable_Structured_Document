[package]
name = "vsd-cli"
description = "Command-line tool for VSD (Verifiable Structured Document): pack, validate, sign, verify, redact, extract, diff."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "vsd"
path = "src/main.rs"

[dependencies]
vsd-core = { workspace = true, features = ["std"] }
vsd-layout = { workspace = true }
vsd-render = { workspace = true }
vsd-pdf = { workspace = true }
vsd-tlog = { workspace = true }
pulldown-cmark = { version = "0.12", default-features = false }
vsd-container = { workspace = true, features = ["zstd"] }
vsd-sign = { workspace = true, features = ["keygen"] }
clap = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true, features = ["std"] }
getrandom = "0.2"
tiny_http = "0.12"

[dev-dependencies]
proptest = { workspace = true }

