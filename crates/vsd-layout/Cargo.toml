[package]
name = "vsd-layout"
description = "Reference layout engine for VSD (vsd-layout/1.0): a deterministic projection from content tree to display lists, per docs/LAYOUT-1.0.md."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
vsd-core = { workspace = true, features = ["std"] }
blake3 = { workspace = true, features = ["std"] }
# Exact pin: the metrics parser is part of the determinism contract.
ttf-parser = "=0.25.1"
thiserror = { workspace = true, features = ["std"] }

[package.metadata.docs.rs]
all-features = true
