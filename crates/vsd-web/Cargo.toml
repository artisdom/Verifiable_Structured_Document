[package]
name = "vsd-web"
description = "WASM viewer core for VSD: read, verify, lay out, and rasterize documents in the browser via a dependency-free <vsd-doc> web component."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pure-Rust zstd decode so compressed containers open in the browser.
vsd-container = { workspace = true, features = ["zstd-pure"] }
vsd-core = { workspace = true, features = ["std"] }
vsd-layout = { workspace = true }
vsd-render = { workspace = true }
# Verify-only (no keygen feature): signature verification needs no RNG,
# so it runs in the browser.
vsd-sign = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Tests sign documents (host-only); the wasm artifact stays verify-only.
vsd-sign = { workspace = true, features = ["keygen"] }

[package.metadata.docs.rs]
all-features = true
