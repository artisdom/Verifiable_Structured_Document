[package]
name = "vsd-view"
description = "Native viewer for VSD documents: page navigation, zoom, exact text search, copy, and a first-class verification banner."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "vsd-view"
path = "src/main.rs"

[dependencies]
vsd-core = { workspace = true, features = ["std"] }
vsd-container = { workspace = true, features = ["zstd"] }
vsd-sign = { workspace = true, features = ["keygen"] }
vsd-layout = { workspace = true }
vsd-render = { workspace = true }
anyhow = { workspace = true }
tiny-skia = "0.11"
winit = "0.30"
softbuffer = "0.4"
arboard = "3"
